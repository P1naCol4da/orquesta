name: G19 Native Orquesta Parity

on:
  push:
    branches:
      - research/g19-pr283-performance-ci
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Orquesta and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test.txt -e .
      - name: Native G19 source-contract regression
        run: |
          python -m pytest -q orquesta/tests/unit/conducting/native/test_rerun_index_g19.py
      - name: Official Orquesta native rerun regression
        run: |
          python -m pytest -q orquesta/tests/unit/conducting/native/test_workflow_rerun.py
      - name: Compare native methods to pinned PR 283
        run: |
          python research/g19/native_compare.py --output results/g19_native_ci.json
      - name: Save comparison and status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g19-native-results
          path: results/g19_native_ci.json
          if-no-files-found: warn
